\* Deliberately broken: one read deadline per direction and no write deadline
\* (the ecd1990 shape). IdleCutOnlyWhenIdle, NoDataDroppedWhileOpen and
\* NoDeadlock must fail here.
CONSTANTS
  C = 2
  ConnectionIdle = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  IdleCutOnlyWhenIdle
  NoDataDroppedWhileOpen
