\* Deliberately broken: the code without the Execute mutex (the ecd1990
\* shape), so concurrent Closed-state callers each reach the credential
\* backend. KDCFailuresBounded and NoLoginWhileOpen must fail here.
CONSTANTS
  K = 4
  Calls = 2
  Threshold = 3
  MaxRequests = 1
  SerializeExecute = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  KDCFailuresBounded
  NoLoginWhileOpen
  SingleProbe
