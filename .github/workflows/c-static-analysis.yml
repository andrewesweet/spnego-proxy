name: C Static Analysis

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.hpp'
      - '.github/workflows/c-static-analysis.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.hpp'
      - '.github/workflows/c-static-analysis.yml'

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run clang-format
        run: clang-format --dry-run --Werror gss_darwin.c gss_darwin.h

  clang-tidy:
    name: clang-tidy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get macOS SDK path
        id: sdk
        run: echo "path=$(xcrun --show-sdk-path)" >> "$GITHUB_OUTPUT"

      - name: Run clang-tidy
        uses: cpp-linter/cpp-linter-action@b6edc0625e3941baa1797f4b4326adeab6890c97 # v2.16.7
        id: linter
        with:
          style: ''
          tidy-checks: '-*,clang-analyzer-*,bugprone-*,-bugprone-easily-swappable-parameters,performance-*,portability-*'
          version: '18'
          files-changed-only: false
          lines-changed-only: false
          extra-args: '-isysroot ${{ steps.sdk.outputs.path }}'
          file-annotations: true
          step-summary: true

      - name: Fail on clang-tidy errors
        if: steps.linter.outputs.clang-tidy-checks-failed > 0
        run: exit 1

  cppcheck:
    name: cppcheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cppcheck
        run: brew install cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            gss_darwin.c
