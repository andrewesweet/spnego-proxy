name: C Static Analysis

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.hpp'
      - '.github/workflows/c-static-analysis.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.hpp'
      - '.github/workflows/c-static-analysis.yml'

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run clang-format
        run: clang-format --dry-run --Werror internal/proxy/gss_darwin.c internal/proxy/gss_darwin.h

  clang-tidy:
    name: clang-tidy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get macOS SDK path
        id: sdk
        run: echo "path=$(xcrun --show-sdk-path)" >> "$GITHUB_OUTPUT"

      - name: Run clang-tidy
        uses: cpp-linter/cpp-linter-action@8e85cd02c8c3fe3ae527c94b5683fe2366b144ed # v2.20.0
        id: linter
        with:
          style: ''
          tidy-checks: '-*,clang-analyzer-*,bugprone-*,-bugprone-easily-swappable-parameters,performance-*,portability-*'
          version: '18'
          files-changed-only: false
          lines-changed-only: false
          extra-args: '-isysroot ${{ steps.sdk.outputs.path }}'
          file-annotations: true
          step-summary: true

      - name: Fail on clang-tidy errors
        if: steps.linter.outputs.clang-tidy-checks-failed > 0
        run: exit 1

  cppcheck:
    name: cppcheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cppcheck
        run: brew install cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --check-level=exhaustive \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            internal/proxy/gss_darwin.c
