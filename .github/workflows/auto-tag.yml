name: Auto Tag

on:
  # zizmor: ignore[dangerous-triggers] workflow_run only fires after the
  # "Build and Test" workflow succeeds on the master branch. The workflow does
  # not check out or execute any code from pull requests, so the elevated
  # privileges granted to workflow_run cannot be exploited by a fork PR.
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [master]

permissions: {}

jobs:
  auto-tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      checks: read
      actions: read
    steps:
      - name: Verify all CI checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Workflows that run on every push to master
          required_workflows=(
            "Build and Test"
            "golangci-lint"
            "govulncheck"
            "Lint Workflows"
            "Lint Markdown"
          )

          # Path-filtered workflows that may not run for every commit.
          # If they ran, they must have succeeded; if absent, that's OK.
          optional_workflows=(
            "CodeQL"
          )

          check_workflow() {
            local workflow="$1" required="$2"
            echo "Checking: ${workflow}"

            local conclusion="" attempt
            for attempt in 1 2 3 4 5; do
              conclusion=$(gh api \
                "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&status=completed" \
                --jq ".workflow_runs[] | select(.name == \"${workflow}\") | .conclusion" \
                | head -1)

              if [ -n "${conclusion}" ]; then
                break
              fi

              if [ "${required}" != "true" ]; then
                break
              fi

              if [ "${attempt}" -lt 5 ]; then
                echo "  -> not found yet, retrying in 15s (attempt ${attempt}/5)..."
                sleep 15
              fi
            done

            if [ -z "${conclusion}" ]; then
              if [ "${required}" = "true" ]; then
                echo "::error::Required workflow '${workflow}' not found for SHA ${SHA}"
                return 1
              fi
              echo "  -> not found (optional, skipping)"
              return 0
            fi

            if [ "${conclusion}" != "success" ]; then
              echo "::error::Workflow '${workflow}' did not succeed (got: ${conclusion})"
              return 1
            fi
            echo "  -> ${conclusion}"
          }

          for workflow in "${required_workflows[@]}"; do
            check_workflow "${workflow}" true
          done

          for workflow in "${optional_workflows[@]}"; do
            check_workflow "${workflow}" false
          done

          echo "All required CI checks passed."

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        # zizmor: ignore[artipacked] credentials are persisted intentionally so the
        # subsequent `git push origin HEAD:master --tags` step can authenticate
        # using the GitHub App token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install git-cliff
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: git-cliff

      - name: Compute next version
        id: version
        run: |
          git tag -l 'v*'
          raw=$(git cliff --bumped-version || true)
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "${raw}" ]; then
            echo "No bump-worthy commits found. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure v prefix for consistency with existing tags
          next="v${raw#v}"

          if [ "${next}" = "${latest}" ]; then
            echo "Computed version ${next} matches latest tag. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Next version: ${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Generate changelog, commit, tag, and push
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git cliff --tag "${VERSION}" -o CHANGELOG.md

          git config user.name "spnego-proxy-release-bot[bot]"
          git config user.email "spnego-proxy-release-bot[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${VERSION}"

          git tag "${VERSION}"
          git push origin HEAD:master --tags

      - name: Job summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SKIP: ${{ steps.version.outputs.skip }}
        run: |
          if [ "${SKIP}" = "true" ]; then
            {
              echo "### Auto Tag"
              echo "No version bump required. No bump-worthy commits since last tag."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${VERSION}" ]; then
            {
              echo "### Auto Tag"
              echo "Tagged and pushed **${VERSION}**."
              echo "The release pipeline will now build and publish the release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
