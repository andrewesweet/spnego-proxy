name: Auto Tag

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [master]

permissions: {}

jobs:
  auto-tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      checks: read
      actions: read
    steps:
      - name: Verify all CI checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Workflows that run on every push to master
          required_workflows=(
            "Build and Test"
            "golangci-lint"
            "govulncheck"
            "Lint Workflows"
            "Lint Markdown"
          )

          # Path-filtered workflows that may not run for every commit.
          # If they ran, they must have succeeded; if absent, that's OK.
          optional_workflows=(
            "CodeQL"
          )

          check_workflow() {
            local workflow="$1" required="$2"
            echo "Checking: ${workflow}"
            conclusion=$(gh api \
              "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&status=completed" \
              --jq ".workflow_runs[] | select(.name == \"${workflow}\") | .conclusion" \
              | head -1)

            if [ -z "${conclusion}" ]; then
              if [ "${required}" = "true" ]; then
                echo "::error::Required workflow '${workflow}' not found for SHA ${SHA}"
                return 1
              fi
              echo "  -> not found (optional, skipping)"
              return 0
            fi

            if [ "${conclusion}" != "success" ]; then
              echo "::error::Workflow '${workflow}' did not succeed (got: ${conclusion})"
              return 1
            fi
            echo "  -> ${conclusion}"
          }

          for workflow in "${required_workflows[@]}"; do
            check_workflow "${workflow}" true
          done

          for workflow in "${optional_workflows[@]}"; do
            check_workflow "${workflow}" false
          done

          echo "All required CI checks passed."

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install git-cliff
        uses: taiki-e/install-action@4a136ceac97fe29b942ff3b6c749a46c7950d853 # v2.68.20
        with:
          tool: git-cliff

      - name: Compute next version
        id: version
        run: |
          git tag -l 'v*'
          raw=$(git cliff --bumped-version || true)
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "${raw}" ]; then
            echo "No bump-worthy commits found. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure v prefix for consistency with existing tags
          next="v${raw#v}"

          if [ "${next}" = "${latest}" ]; then
            echo "Computed version ${next} matches latest tag. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Next version: ${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Generate changelog, commit, tag, and push
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git cliff --tag "${VERSION}" -o CHANGELOG.md

          git config user.name "spnego-proxy-release-bot[bot]"
          git config user.email "spnego-proxy-release-bot[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${VERSION}"

          git tag "${VERSION}"
          git push origin HEAD:master --tags

      - name: Job summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SKIP: ${{ steps.version.outputs.skip }}
        run: |
          if [ "${SKIP}" = "true" ]; then
            {
              echo "### Auto Tag"
              echo "No version bump required. No bump-worthy commits since last tag."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${VERSION}" ]; then
            {
              echo "### Auto Tag"
              echo "Tagged and pushed **${VERSION}**."
              echo "The release pipeline will now build and publish the release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
