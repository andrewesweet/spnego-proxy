name: Auto Tag

on:
  # zizmor: ignore[dangerous-triggers] workflow_run grants an elevated
  # github.token, but this workflow only reacts to runs of this repository's
  # own required CI workflows on the master branch. The `branches: [master]`
  # filter matches the triggering run's head_branch, so a fork branch named
  # "master" would still pass it; the job-level repository-origin guard
  # below stops such runs before any privileged step. This workflow never
  # checks out or executes code from a pull request: the checkout below is
  # pinned to the verified head SHA of a master push, and pushes
  # authenticate with a dedicated GitHub App token.
  workflow_run:
    # One completion event per required workflow: Auto Tag fires each time
    # any of these finishes, and the Verify step below tags a commit only
    # once ALL of them have succeeded for it. The release therefore waits
    # for the last required workflow to finish instead of failing when the
    # first-completed trigger still finds the rest running. Keep this list
    # in sync with required_workflows in the Verify step.
    workflows:
      - "Build and Test"
      - "golangci-lint"
      - "govulncheck"
      - "Lint Workflows"
      - "Lint Markdown"
    types: [completed]
    branches: [master]

permissions: {}

concurrency:
  # Two required workflows can complete for the same head commit within
  # seconds of each other; serialise their Auto Tag runs so only one is
  # ever mid-release. The tip check and the atomic push in the release
  # steps remain the guard when the concurrent runs are for DIFFERENT
  # commits (one push superseding another).
  group: auto-tag-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-tag:
    # workflow_run's branch filter matches the triggering run's head_branch
    # only, so a fork branch named "master" would pass it. Require the
    # triggering run to originate from this repository before anything
    # privileged happens.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    # No conclusion filter here: the Verify step decides per completion
    # whether to skip cleanly (a required workflow has not completed yet),
    # fail (every required workflow completed and one did not succeed), or
    # proceed to tag.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      checks: read
      actions: read
    steps:
      - name: Verify all CI checks passed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_RUN: ${{ toJSON(github.event.workflow_run) }}
        run: |
          set -o pipefail
          # --- gating decision (inputs and pure function; exercised by .github/scripts/test-auto-tag-gate.sh against recorded API JSON) ---

          # Workflows that run on every push to master. Auto Tag is
          # triggered by each one's completion (see workflow_run above);
          # keep this list in sync with that trigger.
          required_workflows=(
            "Build and Test"
            "golangci-lint"
            "govulncheck"
            "Lint Workflows"
            "Lint Markdown"
          )

          # Path-filtered workflows that may not run for every commit.
          # They block the release only when they completed without
          # success: an absent or still-running optional workflow never
          # blocks, because its completion does not trigger Auto Tag, so
          # waiting for it could strand a release forever.
          optional_workflows=(
            "CodeQL"
          )

          # Reads this commit's workflow runs on stdin (a flat JSON array
          # of run objects) and prints exactly one decision line:
          #   tag|<reason>   every required workflow succeeded
          #   skip|<csv>     some required workflow has not completed yet
          #   no-tag|<csv>   every required workflow completed; one failed
          # The most recent run of a workflow wins, so a re-run supersedes
          # earlier runs of the same workflow.
          decide() {
            local req opt
            req=$(jq -cn '$ARGS.positional' --args -- "${required_workflows[@]}")
            opt=$(jq -cn '$ARGS.positional' --args -- "${optional_workflows[@]}")
            # shellcheck disable=SC2016  # jq program, not shell expansion
            jq -r --argjson req "${req}" --argjson opt "${opt}" \
              --argjson trigger "${TRIGGER_RUN}" --argjson final "${FINAL:-0}" '
              if ($req | length) == 0
              then "no-tag|required workflow list is empty"
              else
              (sort_by(.id) | map({(.name): .}) | add // {})
              | .[$trigger.name] as $observed
              | if $trigger.event == "push" and $trigger.head_branch == "master"
                   and ($req | index($trigger.name)) != null
                   and ($observed.id != $trigger.id
                        or $observed.run_attempt < $trigger.run_attempt
                        or ($observed.run_attempt == $trigger.run_attempt
                            and ($observed.status != "completed"
                                 or $observed.conclusion != $trigger.conclusion)))
                then .[$trigger.name] = ($trigger | .status = (
                  if $final == 1 then "completed" else "in_progress" end))
                else .
                end
              | with_entries(.value |= (
                  if .status != "completed" then "pending"
                  elif .conclusion == "success" then "success"
                  else "failed"
                  end)) as $latest
              | [ $req[]
                  | {workflow: ., state: ($latest[.] // "absent"), required: true} ]
                + [ $opt[]
                    | {workflow: ., state: ($latest[.] // "absent"), required: false} ]
              | {
                  pending: ([ .[]
                    | select(.required and (.state == "pending" or .state == "absent"))
                    | .workflow ]),
                  failed: ([ .[]
                    | select(.state == "failed")
                    | .workflow ])
                }
              | if   (.pending | length) > 0 then "skip|"   + (.pending | join(", "))
                elif (.failed  | length) > 0 then "no-tag|" + (.failed  | join(", "))
                else                              "tag|"    + "all required workflows succeeded"
                end
              end'
          }
          # --- end gating decision ---

          # --- gating loop (fetch runs, decide, and re-query on API lag; exercised by .github/scripts/test-auto-tag-gate.sh) ---

          # Every push run for this commit on master, across all pages,
          # restricted to event=push and branch=master so a pull-request
          # run for the same SHA cannot shadow a push run. This includes
          # unrelated workflows for the same SHA; decide() looks only at
          # the required and optional names above. gh --slurp cannot be
          # combined with gh --jq, so the page array is flattened by jq
          # instead.
          fetch_runs() {
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/actions/runs?head_sha=${SHA}&event=push&branch=master&per_page=100" \
              | jq -c '[.[].workflow_runs[]]'
          }

          # API indexing can lag the completion event that started this
          # run: the run that just finished may not be listed yet, and if
          # that was the LAST required completion, a premature skip would
          # strand the release with nothing left to re-trigger it. Before
          # accepting a required workflow as pending or absent, re-query a
          # bounded number of times over about a minute; a genuinely
          # running workflow only delays its clean skip, and a later
          # completion re-runs the gate anyway.
          decision=""
          attempt=0
          max_attempts=3        # one initial fetch plus two re-queries
          requery_delay_secs=30 # re-queries span about 60s worst case
          while :; do
            runs_json=$(fetch_runs)
            decision=$(FINAL=$((attempt + 1 == max_attempts)) decide <<<"${runs_json}")
            case "${decision}" in
              "skip|"*)
                if [ $((attempt += 1)) -ge "${max_attempts}" ]; then
                  break
                fi
                sleep "${requery_delay_secs}"
                ;;
              *)
                break
                ;;
            esac
          done
          # --- end gating loop ---

          {
            echo "decision=${decision%%|*}"
            echo "reason=${decision#*|}"
          } >> "$GITHUB_OUTPUT"

          case "${decision}" in
            "tag|"*)
              echo "All required CI checks passed."
              ;;
            "skip|"*)
              echo "::notice::Auto Tag skipping: required CI not complete yet for ${SHA}: ${decision#skip|}. Auto Tag runs again when each of them completes."
              exit 0
              ;;
            "no-tag|"*)
              echo "::error::Required CI did not succeed for ${SHA}: ${decision#no-tag|}. No tag will be created."
              exit 1
              ;;
            *)
              echo "::error::Auto Tag gate produced an unexpected decision: ${decision}"
              exit 1
              ;;
          esac

      - name: Generate GitHub App token
        id: app-token
        if: steps.gate.outputs.decision == 'tag'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        if: steps.gate.outputs.decision == 'tag'
        # zizmor: ignore[artipacked] credentials are persisted intentionally so the
        # subsequent `git push --atomic origin HEAD:master` step can authenticate
        # using the GitHub App token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For a workflow_run trigger, actions/checkout without an explicit ref
          # checks out the default branch tip at checkout time, not the commit
          # that triggered the upstream run. Pin the checkout to the verified
          # head_sha so the release commit is always built on the triggering
          # commit. The tip check in "Compute next version" skips superseded
          # runs; the atomic push rejects later non-fast-forward updates.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install git-cliff
        if: steps.gate.outputs.decision == 'tag'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: git-cliff

      - name: Compute next version
        id: version
        if: steps.gate.outputs.decision == 'tag'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Skip when the triggering commit is no longer the tip of master: a
          # newer push to master superseded this run, and tagging here would
          # collide with the run for that newer commit. The next green run on
          # master tags instead.
          git fetch --quiet origin master
          tip=$(git rev-parse origin/master)
          if [ "${tip}" != "${SHA}" ]; then
            echo "::notice::Skipping auto-tag: triggering commit ${SHA} is no longer the tip of master (current tip ${tip})."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=Superseded: triggering commit is no longer the tip of master." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -l 'v*'
          # No "|| true" here on purpose: if git-cliff fails, this step must
          # fail visibly rather than fall through to the no-bump skip below.
          # A genuine empty result (exit 0) still means no bump-worthy commits.
          raw=$(git cliff --bumped-version)
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "${raw}" ]; then
            echo "No bump-worthy commits found. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=No version bump required. No bump-worthy commits since last tag." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure v prefix for consistency with existing tags
          next="v${raw#v}"

          if [ "${next}" = "${latest}" ]; then
            echo "Computed version ${next} matches latest tag. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=No version bump required. Computed version ${next} matches latest tag." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Next version: ${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Generate changelog, commit, tag, and push
        id: release
        if: steps.gate.outputs.decision == 'tag' && steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git cliff --tag "${VERSION}" -o CHANGELOG.md

          git config user.name "spnego-proxy-release-bot[bot]"
          git config user.email "spnego-proxy-release-bot[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${VERSION}"

          git tag "${VERSION}"
          # Push the release commit and its tag atomically: either both land or
          # neither does. If master moved between the tip check above and this
          # push, the push is rejected as non-fast-forward and the job fails
          # visibly with nothing pushed; the next green run on master retries.
          git push --atomic origin HEAD:master "refs/tags/${VERSION}"
          # Only reached when both refs landed; the job summary gates its
          # success text on this output so a rejected push is never reported
          # as "Tagged and pushed".
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        env:
          GATE_DECISION: ${{ steps.gate.outputs.decision }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          VERSION: ${{ steps.version.outputs.version }}
          SKIP: ${{ steps.version.outputs.skip }}
          SKIP_REASON: ${{ steps.version.outputs.skip_reason }}
          PUSHED: ${{ steps.release.outputs.pushed }}
        run: |
          if [ "${GATE_DECISION}" = "skip" ]; then
            {
              echo "### Auto Tag"
              echo "Skipped: required CI not complete yet: ${GATE_REASON}."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${GATE_DECISION}" = "no-tag" ]; then
            {
              echo "### Auto Tag"
              echo "No tag created: CI did not succeed: ${GATE_REASON}."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${SKIP}" = "true" ]; then
            {
              echo "### Auto Tag"
              echo "${SKIP_REASON}"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${PUSHED}" = "true" ]; then
            {
              echo "### Auto Tag"
              echo "Tagged and pushed **${VERSION}**."
              echo "The release pipeline will now build and publish the release."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Auto Tag"
              echo "Auto-tag did not complete successfully. Check the preceding steps for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
