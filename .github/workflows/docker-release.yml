name: Docker Release

on:
  workflow_call: {}

permissions: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download linux/amd64 binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spnego-proxy_${{ github.ref_name }}_linux_amd64.tar.gz
          path: artifacts/

      - name: Download linux/arm64 binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spnego-proxy_${{ github.ref_name }}_linux_arm64.tar.gz
          path: artifacts/

      - name: Extract binaries from archives
        run: |
          mkdir -p build/linux-amd64 build/linux-arm64
          tar -xzf "artifacts/spnego-proxy_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C build/linux-amd64
          tar -xzf "artifacts/spnego-proxy_${GITHUB_REF_NAME}_linux_arm64.tar.gz" -C build/linux-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect pre-release from SemVer tag
        id: semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push amd64 image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: build/linux-amd64
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: build/linux-arm64
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-arm64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Create and push multi-arch manifest
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.semver.outputs.prerelease }}
        run: |
          REPO="ghcr.io/${{ github.repository }}"

          docker buildx imagetools create \
            --tag "${REPO}:${TAG}" \
            "${REPO}:${TAG}-amd64" \
            "${REPO}:${TAG}-arm64"

          if [[ "$PRERELEASE" == "false" ]]; then
            docker buildx imagetools create \
              --tag "${REPO}:latest" \
              "${REPO}:${TAG}-amd64" \
              "${REPO}:${TAG}-arm64"
          fi
