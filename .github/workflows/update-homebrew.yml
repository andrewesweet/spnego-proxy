name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag (e.g. v1.2.3)"
        required: true
        type: string
      dry_run:
        description: "Skip push to tap repo"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      prerelease:
        required: false
        type: boolean
        default: false
    secrets:
      HOMEBREW_DEPLOY_KEY:
        required: true

permissions: {}

concurrency:
  group: homebrew-update
  cancel-in-progress: false

jobs:
  update-formula:
    if: ${{ !(inputs.prerelease || github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Compute source tarball SHA256
        id: sha256
        env:
          TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          url="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          sha256=$(curl -sfL "${url}" | sha256sum | cut -d ' ' -f 1)
          if [ -z "${sha256}" ] || [ "${sha256}" = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
            echo "::error::Failed to download tarball or got empty response"
            exit 1
          fi
          {
            echo "sha256=${sha256}"
            echo "url=${url}"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up SSH for deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_DEPLOY_KEY }}
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::HOMEBREW_DEPLOY_KEY secret is not configured"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin GitHub's host keys from the authenticated HTTPS metadata API
          # rather than trusting whatever the SSH path serves (ssh-keyscan is
          # trust-on-first-use). Auto-adapts to GitHub host-key rotation. See
          # issue #226.
          curl -fsSL --retry 3 https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::failed to fetch GitHub SSH host keys from api.github.com/meta"
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes"

      - name: Clone tap repo
        run: git clone git@github.com:andrewesweet/homebrew-spnego-proxy.git /tmp/tap

      - name: Update formula
        env:
          VERSION: ${{ steps.sha256.outputs.version }}
          URL: ${{ steps.sha256.outputs.url }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          cd /tmp/tap
          sed -i "s|^\(  url \).*|  url \"${URL}\"|" Formula/spnego-proxy.rb
          sed -i "s|^\(  sha256 \).*|  sha256 \"${SHA256}\"|" Formula/spnego-proxy.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.sha256.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/spnego-proxy.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "feat: update spnego-proxy to ${VERSION}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run — skipping push. Diff:"
            git show --stat HEAD
          else
            git push origin main
          fi

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
