name: Build Release Binaries

on:
  workflow_call: {}

permissions: {}

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: ['amd64', 'arm64']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version

      - name: Run unit tests
        if: matrix.arch == 'arm64'
        env:
          CGO_ENABLED: "1"
        run: go test -v -count=1 ./...

      - name: Build (darwin/${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: darwin
          CGO_ENABLED: "1"
          CC: ${{ matrix.arch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
        run: >-
          go build -v -trimpath
          -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${{ github.sha }}"
          -o spnego-proxy-darwin-${{ matrix.arch }} .

      - name: Verify binary architecture
        run: |
          file spnego-proxy-darwin-${{ matrix.arch }}
          otool -L spnego-proxy-darwin-${{ matrix.arch }}

      - name: Verify GSS framework linkage
        run: otool -L spnego-proxy-darwin-${{ matrix.arch }} | grep -i GSS

      - name: Create tar.gz archive
        run: |
          mkdir -p staging
          cp spnego-proxy-darwin-${{ matrix.arch }} staging/spnego-proxy
          cp LICENSE README.md staging/
          tar -czf "spnego-proxy_${GITHUB_REF_NAME}_darwin_${{ matrix.arch }}.tar.gz" -C staging .

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: spnego-proxy_${{ github.ref_name }}_darwin_${{ matrix.arch }}.tar.gz

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: spnego-proxy_${{ github.ref_name }}_darwin_${{ matrix.arch }}.tar.gz
          sbom-path: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spnego-proxy_${{ github.ref_name }}_darwin_${{ matrix.arch }}.tar.gz
          path: spnego-proxy_${{ github.ref_name }}_darwin_${{ matrix.arch }}.tar.gz

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json
          path: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: ['amd64', 'arm64']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .go-version

      - name: Run unit tests
        if: matrix.arch == 'amd64'
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 ./...

      - name: Build (linux/${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: "0"
        run: >-
          go build -v -trimpath
          -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${{ github.sha }}"
          -o spnego-proxy-linux-${{ matrix.arch }} .

      - name: Verify binary
        run: file spnego-proxy-linux-${{ matrix.arch }}

      - name: Create tar.gz archive
        run: |
          mkdir -p staging
          cp spnego-proxy-linux-${{ matrix.arch }} staging/spnego-proxy
          cp LICENSE README.md staging/
          tar -czf "spnego-proxy_${GITHUB_REF_NAME}_linux_${{ matrix.arch }}.tar.gz" -C staging .

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: spnego-proxy_${{ github.ref_name }}_linux_${{ matrix.arch }}.tar.gz

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: spnego-proxy-linux-${{ matrix.arch }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: spnego-proxy_${{ github.ref_name }}_linux_${{ matrix.arch }}.tar.gz
          sbom-path: spnego-proxy-linux-${{ matrix.arch }}.sbom.spdx.json

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spnego-proxy_${{ github.ref_name }}_linux_${{ matrix.arch }}.tar.gz
          path: spnego-proxy_${{ github.ref_name }}_linux_${{ matrix.arch }}.tar.gz

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spnego-proxy-linux-${{ matrix.arch }}.sbom.spdx.json
          path: spnego-proxy-linux-${{ matrix.arch }}.sbom.spdx.json
