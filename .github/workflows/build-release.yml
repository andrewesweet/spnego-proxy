name: Build Release Binaries

on:
  workflow_call: {}

permissions: {}

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: ['amd64', 'arm64']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version

      - name: Run unit tests
        if: matrix.arch == 'arm64'
        env:
          CGO_ENABLED: "1"
        run: go test -v -count=1 ./...

      - name: Build (darwin/${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: darwin
          CGO_ENABLED: "1"
          CC: ${{ matrix.arch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
        run: go build -v -trimpath -o spnego-proxy-darwin-${{ matrix.arch }} .

      - name: Verify binary architecture
        run: |
          file spnego-proxy-darwin-${{ matrix.arch }}
          otool -L spnego-proxy-darwin-${{ matrix.arch }}

      - name: Verify GSS framework linkage
        run: otool -L spnego-proxy-darwin-${{ matrix.arch }} | grep -i GSS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: spnego-proxy-darwin-${{ matrix.arch }}

      - name: Generate SBOM
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        with:
          path: .
          format: spdx-json
          output-file: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@07e74fc4e78d1aad915e867f9a094073a9f71527 # v4.0.0
        with:
          subject-path: spnego-proxy-darwin-${{ matrix.arch }}
          sbom-path: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json

      - name: Upload binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spnego-proxy-darwin-${{ matrix.arch }}
          path: spnego-proxy-darwin-${{ matrix.arch }}

      - name: Upload SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json
          path: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version

      - name: Run unit tests
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 ./...

      - name: Build (linux/amd64)
        env:
          GOARCH: amd64
          GOOS: linux
          CGO_ENABLED: "0"
        run: go build -v -trimpath -o spnego-proxy-linux-amd64 .

      - name: Verify binary
        run: file spnego-proxy-linux-amd64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: spnego-proxy-linux-amd64

      - name: Generate SBOM
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        with:
          path: .
          format: spdx-json
          output-file: spnego-proxy-linux-amd64.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@07e74fc4e78d1aad915e867f9a094073a9f71527 # v4.0.0
        with:
          subject-path: spnego-proxy-linux-amd64
          sbom-path: spnego-proxy-linux-amd64.sbom.spdx.json

      - name: Upload binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spnego-proxy-linux-amd64
          path: spnego-proxy-linux-amd64

      - name: Upload SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spnego-proxy-linux-amd64.sbom.spdx.json
          path: spnego-proxy-linux-amd64.sbom.spdx.json
