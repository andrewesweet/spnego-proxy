name: Build Release Binaries

on:
  workflow_call: {}

permissions: {}

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: ['amd64', 'arm64']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: .go-version

      - name: Build (darwin/${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: darwin
          CGO_ENABLED: "1"
          CC: ${{ matrix.arch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
        run: go build -v -trimpath -o spnego-proxy-darwin-${{ matrix.arch }} .

      - name: Verify binary architecture
        run: |
          file spnego-proxy-darwin-${{ matrix.arch }}
          otool -L spnego-proxy-darwin-${{ matrix.arch }}

      - name: Verify GSS framework linkage
        run: otool -L spnego-proxy-darwin-${{ matrix.arch }} | grep -i GSS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: spnego-proxy-darwin-${{ matrix.arch }}

      - name: Generate SBOM
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          path: .
          format: spdx-json
          output-file: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: spnego-proxy-darwin-${{ matrix.arch }}
          sbom-path: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spnego-proxy-darwin-${{ matrix.arch }}
          path: spnego-proxy-darwin-${{ matrix.arch }}

      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json
          path: spnego-proxy-darwin-${{ matrix.arch }}.sbom.spdx.json

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: .go-version

      - name: Build (linux/amd64)
        env:
          GOARCH: amd64
          GOOS: linux
          CGO_ENABLED: "0"
        run: go build -v -trimpath -o spnego-proxy-linux-amd64 .

      - name: Verify binary
        run: file spnego-proxy-linux-amd64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: spnego-proxy-linux-amd64

      - name: Generate SBOM
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          path: .
          format: spdx-json
          output-file: spnego-proxy-linux-amd64.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: spnego-proxy-linux-amd64
          sbom-path: spnego-proxy-linux-amd64.sbom.spdx.json

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spnego-proxy-linux-amd64
          path: spnego-proxy-linux-amd64

      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spnego-proxy-linux-amd64.sbom.spdx.json
          path: spnego-proxy-linux-amd64.sbom.spdx.json
