name: Build and Test

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: ['amd64', 'arm64']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version

      - name: Ensure Rosetta 2 is available
        if: matrix.arch == 'amd64'
        run: arch -x86_64 /usr/bin/true

      - name: Build (darwin/${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: darwin
          CGO_ENABLED: "1"
          CC: ${{ matrix.arch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
        run: go build -v -trimpath -o spnego-proxy-darwin-${{ matrix.arch }} .

      - name: Verify binary architecture
        run: |
          file spnego-proxy-darwin-${{ matrix.arch }}
          otool -L spnego-proxy-darwin-${{ matrix.arch }}

      - name: Verify GSS framework linkage
        run: otool -L spnego-proxy-darwin-${{ matrix.arch }} | grep -i GSS

      - name: Install MIT Kerberos (for integration tests)
        if: matrix.arch == 'arm64'
        run: brew install krb5

      - name: Run unit and integration tests
        if: matrix.arch == 'arm64'
        env:
          CGO_ENABLED: "1"
          INTEGRATION: "1"
        run: |
          KRB5_PREFIX="$(brew --prefix krb5)"
          export PATH="${KRB5_PREFIX}/bin:${KRB5_PREFIX}/sbin:$PATH"
          go test -v -race -count=1 ./... 2>&1 | tee test-output.txt

      - name: Verify binary runs
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            arch -x86_64 ./spnego-proxy-darwin-${{ matrix.arch }} -h 2>&1 || true
          else
            ./spnego-proxy-darwin-${{ matrix.arch }} -h 2>&1 || true
          fi

      - name: Upload binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spnego-proxy-darwin-${{ matrix.arch }}
          path: spnego-proxy-darwin-${{ matrix.arch }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version

      - name: Build (linux/amd64 - gokrb5 fallback)
        env:
          CGO_ENABLED: "0"
        run: go build -v -trimpath -o spnego-proxy-linux-amd64 .

      - name: Verify binary
        run: file spnego-proxy-linux-amd64

      - name: Run unit tests
        env:
          CGO_ENABLED: "1"
        run: go test -v -race -count=1 ./...

      - name: Verify binary runs
        run: ./spnego-proxy-linux-amd64 -h 2>&1 || true

      - name: Upload binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spnego-proxy-linux-amd64
          path: spnego-proxy-linux-amd64
