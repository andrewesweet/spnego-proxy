name: Build and Test

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
        arch: ['amd64', 'arm64']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build (darwin/${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.arch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
        run: go build -v -o spnego-proxy-darwin-${{ matrix.arch }} .

      - name: Verify binary architecture
        run: |
          file spnego-proxy-darwin-${{ matrix.arch }}
          otool -L spnego-proxy-darwin-${{ matrix.arch }}

      - name: Verify GSS framework linkage
        run: otool -L spnego-proxy-darwin-${{ matrix.arch }} | grep -i GSS

      - name: Run unit tests
        if: matrix.arch == 'arm64'
        env:
          CGO_ENABLED: "1"
        run: go test -v -count=1 ./...

      - name: Verify binary runs
        if: matrix.arch == 'arm64'
        run: ./spnego-proxy-darwin-${{ matrix.arch }} -h 2>&1 || true

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spnego-proxy-darwin-${{ matrix.arch }}-go${{ matrix.go-version }}
          path: spnego-proxy-darwin-${{ matrix.arch }}

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build (linux/amd64 - gokrb5 fallback)
        env:
          CGO_ENABLED: "0"
        run: go build -v -o spnego-proxy-linux-amd64 .

      - name: Verify binary
        run: file spnego-proxy-linux-amd64

      - name: Run unit tests
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 ./...

      - name: Verify binary runs
        run: ./spnego-proxy-linux-amd64 -h 2>&1 || true

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spnego-proxy-linux-amd64-go${{ matrix.go-version }}
          path: spnego-proxy-linux-amd64
