name: Build and Test

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: ['amd64', 'arm64']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: .go-version

      - name: Ensure Rosetta 2 is available
        if: matrix.arch == 'amd64'
        run: arch -x86_64 /usr/bin/true

      - name: Build (darwin/${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.arch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
        run: go build -v -o spnego-proxy-darwin-${{ matrix.arch }} .

      - name: Verify binary architecture
        run: |
          file spnego-proxy-darwin-${{ matrix.arch }}
          otool -L spnego-proxy-darwin-${{ matrix.arch }}

      - name: Verify GSS framework linkage
        run: otool -L spnego-proxy-darwin-${{ matrix.arch }} | grep -i GSS

      - name: Run unit tests
        if: matrix.arch == 'arm64'
        env:
          CGO_ENABLED: "1"
        run: go test -v -count=1 ./...

      - name: Verify binary runs
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            arch -x86_64 ./spnego-proxy-darwin-${{ matrix.arch }} -h 2>&1 || true
          else
            ./spnego-proxy-darwin-${{ matrix.arch }} -h 2>&1 || true
          fi

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spnego-proxy-darwin-${{ matrix.arch }}
          path: spnego-proxy-darwin-${{ matrix.arch }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: .go-version

      - name: Build (linux/amd64 - gokrb5 fallback)
        env:
          CGO_ENABLED: "0"
        run: go build -v -o spnego-proxy-linux-amd64 .

      - name: Verify binary
        run: file spnego-proxy-linux-amd64

      - name: Run unit tests
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 ./...

      - name: Verify binary runs
        run: ./spnego-proxy-linux-amd64 -h 2>&1 || true

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spnego-proxy-linux-amd64
          path: spnego-proxy-linux-amd64
