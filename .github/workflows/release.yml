name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  docker:
    needs: build
    uses: ./.github/workflows/docker-release.yml
    permissions:
      contents: read
      packages: write

  release:
    needs:
      - build
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes from changelog
        id: changelog
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72 # v4.7.1
        with:
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          pattern: spnego-proxy*
          merge-multiple: true

      - name: Generate checksums for all release artifacts
        working-directory: artifacts
        run: |
          shasum -a 256 \
            "spnego-proxy_${GITHUB_REF_NAME}_darwin_amd64.tar.gz" \
            "spnego-proxy_${GITHUB_REF_NAME}_darwin_arm64.tar.gz" \
            "spnego-proxy_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
            "spnego-proxy_${GITHUB_REF_NAME}_linux_arm64.tar.gz" \
            spnego-proxy-darwin-amd64.sbom.spdx.json \
            spnego-proxy-darwin-arm64.sbom.spdx.json \
            spnego-proxy-linux-amd64.sbom.spdx.json \
            spnego-proxy-linux-arm64.sbom.spdx.json \
            > checksums-sha256.txt

      - name: Detect pre-release from SemVer tag
        id: semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # SemVer 2.0.0: pre-release version indicated by hyphen after patch
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release with assets
        # softprops/action-gh-release is used intentionally for its native
        # handling of multi-file asset uploads, draft/prerelease flags, and
        # release notes. Replacing it with a `gh release` script would
        # re-implement that behavior with no security benefit, since the
        # action runs pinned to a commit SHA.
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.semver.outputs.prerelease == 'true' }}
          body: ${{ steps.changelog.outputs.content }}
          make_latest: ${{ steps.semver.outputs.prerelease != 'true' }}
          files: |
            artifacts/spnego-proxy_${{ github.ref_name }}_darwin_amd64.tar.gz
            artifacts/spnego-proxy_${{ github.ref_name }}_darwin_arm64.tar.gz
            artifacts/spnego-proxy_${{ github.ref_name }}_linux_amd64.tar.gz
            artifacts/spnego-proxy_${{ github.ref_name }}_linux_arm64.tar.gz
            artifacts/spnego-proxy-darwin-amd64.sbom.spdx.json
            artifacts/spnego-proxy-darwin-arm64.sbom.spdx.json
            artifacts/spnego-proxy-linux-amd64.sbom.spdx.json
            artifacts/spnego-proxy-linux-arm64.sbom.spdx.json
            artifacts/checksums-sha256.txt

      - name: Publish release (makes it immutable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --draft=false

  homebrew:
    needs: release
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag_name: ${{ github.ref_name }}
      prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
    secrets:
      HOMEBREW_DEPLOY_KEY: ${{ secrets.HOMEBREW_DEPLOY_KEY }}
