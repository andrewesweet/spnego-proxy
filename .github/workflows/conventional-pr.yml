name: Conventional PR Title

on:
  # zizmor: ignore[dangerous-triggers] pull_request_target is required so the
  # workflow can read the PR title even when the PR comes from a fork. The
  # workflow never checks out or executes PR head code; it only inspects
  # github.event.pull_request.title via the `pull-requests: read` permission.
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            perf
            ci
            build
            chore
          scopes: |
            security
            deps
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: "PR title must have a non-empty description after the type."
