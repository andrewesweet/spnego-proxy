name: ClusterFuzzLite Batch

# Nightly deep fuzzing. Three sequential jobs share one storage repo:
#   batch  -> grows the corpus (fuzz-seconds 3600 across all targets)
#   prune  -> trims redundant corpus entries (mandatory companion to batch)
#   coverage -> publishes an HTML report to the storage repo's gh-pages branch
# `needs:` guarantees ordering; the cflite-storage concurrency group serialises
# against the continuous-build workflow so corpus writes never race.
#
# ClusterFuzzLite clones the storage repo inside the OSS-Fuzz build container
# (no ssh, host ~/.ssh not mounted), so SSH deploy keys are unusable here.
# Auth is a fine-grained PAT scoped to ONLY spnego-proxy-fuzz-corpus
# (contents: read/write), secret FUZZ_CORPUS_TOKEN; GitHub masks it in logs.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Batch fuzzing seconds (lower for fast on-demand storage checks)'
        required: false
        default: '3600'

permissions:
  contents: read

concurrency:
  group: cflite-storage
  cancel-in-progress: false

env:
  STORAGE_REPO: https://x-access-token:${{ secrets.FUZZ_CORPUS_TOKEN }}@github.com/andrewesweet/spnego-proxy-fuzz-corpus.git

jobs:
  batch:
    name: batch fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: main

      - name: Run batch fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: go
          mode: batch
          # On schedule, github.event.inputs.fuzz_seconds is '' (falsy), so the
          # || fallback yields 3600. The input's declared default only pre-fills
          # the manual-dispatch UI; it does not feed this expression.
          fuzz-seconds: ${{ github.event.inputs.fuzz_seconds || '3600' }}
          sanitizer: address
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: main

  prune:
    name: corpus pruning
    needs: batch
    runs-on: ubuntu-latest
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: main

      - name: Prune corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: go
          mode: prune
          sanitizer: address
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: main

  coverage:
    name: coverage report
    needs: prune
    runs-on: ubuntu-latest
    steps:
      - name: Build fuzzers (coverage)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: main

      - name: Generate coverage report
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: go
          mode: coverage
          sanitizer: coverage
          storage-repo: ${{ env.STORAGE_REPO }}
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
