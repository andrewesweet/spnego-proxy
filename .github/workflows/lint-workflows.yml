name: Lint Workflows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true
          # release.yml refers to its reusable workflows with GitHub's
          # self-repository `uses: $/...` syntax (adopting zizmor's
          # self-repository audit), which actionlint 1.7.12 does not yet parse
          # (rhysd/actionlint#711, #732). Ignore only errors that mention such
          # a reference (the dot is escaped, so the pattern cannot match an
          # unrelated path); drop this flag once actionlint ships support.
          flags: -ignore \$/\.github/workflows/

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  pinact:
    name: pinact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify actions are pinned
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          skip_push: "true"

  gate-tests:
    name: gate tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs both Auto Tag test scripts: test-auto-tag-gate.sh extracts and
      # drives the shipped gating blocks against recorded API JSON, and it
      # chains test-auto-tag-workflow.rb, which normalizes the workflow and
      # executes the shipped step script with a stubbed gh.
      - name: Run the Auto Tag gate and workflow tests
        run: bash .github/scripts/test-auto-tag-gate.sh
